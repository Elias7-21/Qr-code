<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Code Generator</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #fbf9f5;
      --card-bg: #ffffff;
      --text: #1d1c1a;
      --muted: #6e6d6a;
      --border: #e6e4df;
      --accent: #da7756; /* Claude Clay accent */
      --accent-hover: #c46445;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fafaf9;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="url"]:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .color-picker-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      background: #fafaf9;
    }

    .color-picker input[type="color"] {
      border: none;
      width: 24px;
      height: 24px;
      cursor: pointer;
      background: none;
    }

    .color-picker span {
      font-size: 0.85rem;
      color: var(--text);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
      display: none;
    }

    .btn-secondary:hover {
      background: #f4f3ef;
    }

    #qrcode-container {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      border-radius: 8px;
      padding: 16px;
      background: #fafaf9;
      border: 1px dashed var(--border);
    }

    #qrcode img, #qrcode canvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    /* Modal for Telegram download preview */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
    }

    .modal img {
      max-width: 80%;
      border-radius: 12px;
      background: white;
      padding: 12px;
      margin-bottom: 16px;
    }

    .modal p {
      color: #ffffff;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-close {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>QR Code Generator</h1>
    <p class="subtitle">Enter a URL to generate your custom QR code</p>

    <div class="form-group">
      <label for="urlInput">Destination URL</label>
      <input type="url" id="urlInput" placeholder="https://example.com" />
    </div>

    <div class="color-picker-row">
      <div class="color-picker">
        <input type="color" id="darkColor" value="#1d1c1a" />
        <span>Foreground</span>
      </div>
      <div class="color-picker">
        <input type="color" id="lightColor" value="#ffffff" />
        <span>Background</span>
      </div>
    </div>

    <button class="btn btn-primary" onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode-container">
      <div id="qrcode"></div>
    </div>

    <button id="downloadBtn" class="btn btn-secondary" onclick="downloadQR()">Download PNG</button>
  </div>

  <!-- Telegram Save Modal -->
  <div id="telegramModal" class="modal">
    <p><strong>Press and hold</strong> the QR code below to save it to your phone's gallery:</p>
    <img id="modalQrImg" src="" alt="QR Code Preview" />
    <button class="modal-close" onclick="closeModal()">Done</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK if available
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let qrcodeInstance = null;

    function generateQR() {
      const url = document.getElementById("urlInput").value.trim();
      const darkColor = document.getElementById("darkColor").value;
      const lightColor = document.getElementById("lightColor").value;
      const qrContainer = document.getElementById("qrcode");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!url) {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
          window.Telegram.WebApp.showAlert("Please enter a link first.");
        } else {
          alert("Please enter a link first.");
        }
        return;
      }

      // Clear existing QR code
      qrContainer.innerHTML = "";

      // Generate QR Code
      qrcodeInstance = new QRCode(qrContainer, {
        text: url,
        width: 200,
        height: 200,
        colorDark: darkColor,
        colorLight: lightColor,
        correctLevel: QRCode.CorrectLevel.H
      });

      // Reveal download button
      downloadBtn.style.display = "block";
    }

    function downloadQR() {
      const canvas = document.querySelector("#qrcode canvas");
      if (!canvas) return;

      const imageUrl = canvas.toDataURL("image/png");

      // Check if running inside Telegram WebApp
      const isTelegram = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;

      if (isTelegram) {
        // Display image modal for long-press saving in Telegram
        document.getElementById("modalQrImg").src = imageUrl;
        document.getElementById("telegramModal").style.display = "flex";
      } else {
        // Direct browser file download
        const link = document.createElement("a");
        link.download = "qrcode.png";
        link.href = imageUrl;
        link.click();
      }
    }

    function closeModal() {
      document.getElementById("telegramModal").style.display = "none";
    }
  </script>

</body>
</html>
